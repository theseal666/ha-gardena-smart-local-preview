open_valve:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: valve
  fields:
    duration:
      required: false
      example: 900
      selector:
        number:
          min: 60
          max: 10800
          unit_of_measurement: s
          mode: box

enable_output:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: switch
  fields:
    duration:
      required: false
      example: 900
      selector:
        number:
          min: 1
          unit_of_measurement: s
          mode: box

start_pump:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: switch
  fields:
    duration:
      required: false
      example: 900
      selector:
        number:
          min: 60
          max: 5400
          unit_of_measurement: s
          mode: box

start_mowing:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: lawn_mower
  fields:
    duration:
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 6
          unit_of_measurement: h
          mode: box
    distance:
      required: false
      example: 20
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: m
          mode: box

set_schedule:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: lawn_mower
  fields:
    schedules:
      required: true
      example: |
        - days: [monday, tuesday, wednesday, thursday, friday, saturday]
          start: "09:30"
          duration_minutes: 340
      selector:
        object:

add_schedule:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: lawn_mower
  fields:
    days:
      required: true
      example: "[monday, thursday]"
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    start:
      required: true
      example: "09:30:00"
      selector:
        time:
    duration_minutes:
      required: true
      example: 180
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

remove_schedule:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: lawn_mower
  fields:
    slot:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 14
          mode: box
